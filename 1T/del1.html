
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matematikk 1T – Del 1</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f4f9;
    margin: 0;
    padding: 20px;
    color: #26354a;
}

main {
    max-width: 850px;
    margin: auto;
}

header {
    background: #1d3557;
    color: white;
    padding: 28px;
    border-radius: 14px;
    margin-bottom: 25px;
}

header h1 {
    margin-top: 0;
}

.oppgave {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 18px;
    box-shadow: 0 2px 8px #0000000c;
}

.oppgave h2 {
    color: #1d3557;
    font-size: 20px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #bbc7d5;
    border-radius: 8px;
    font-size: 17px;
    margin: 10px 0;
}

button {
    padding: 11px 17px;
    border: none;
    border-radius: 8px;
    background: #2563a6;
    color: white;
    font-size: 15px;
    cursor: pointer;
    margin: 5px 5px 5px 0;
}

button:hover {
    opacity: 0.85;
}

.fasit-knapp {
    background: #65758b;
}

.resultat {
    margin-top: 12px;
    font-weight: bold;
}

.riktig {
    color: #16803c;
}

.feil {
    color: #c0392b;
}

.fasit {
    display: none;
    background: #edf4fb;
    padding: 13px;
    border-radius: 8px;
    margin-top: 12px;
}

#poeng {
    background: #e3edf8;
    padding: 17px;
    border-radius: 10px;
    margin-bottom: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<main>

<header>
    <a href="1t.html" style="color:white;">← Tilbake til Matematikk 1T</a>
    <h1>Matematikk 1T – Del 1</h1>
    <p>Les oppgavene, skriv svarene og sjekk om du har riktig.</p>
</header>

<div id="poeng">
    Poeng: <span id="riktige">0</span> / 
    <span id="totalt">2</span>
</div>

<!-- OPPGAVE 1 -->
<section class="oppgave">
    <h2>Oppgave 1</h2>
    <p>Løs likningen:</p>
    <p><strong>2x + 5 = 15</strong></p>

    <label for="svar1">Ditt svar:</label>
    <input id="svar1" type="text" placeholder="Skriv svaret ditt">

    <button onclick="sjekk(1, '5')">Sjekk svaret</button>
    <button class="fasit-knapp" onclick="visFasit(1)">Vis/skjul fasit</button>

    <div id="resultat1" class="resultat"></div>

    <div id="fasit1" class="fasit">
        <strong>Fasit:</strong>
        x = 5
        <p>2x + 5 = 15</p>
        <p>2x = 10</p>
        <p>x = 5</p>
    </div>
</section>

<!-- OPPGAVE 2 -->
<section class="oppgave">
    <h2>Oppgave 2</h2>
    <p>Regn ut:</p>
    <p><strong>3 · 4 + 8</strong></p>

    <label for="svar2">Ditt svar:</label>
    <input id="svar2" type="text" placeholder="Skriv svaret ditt">

    <button onclick="sjekk(2, '20')">Sjekk svaret</button>
    <button class="fasit-knapp" onclick="visFasit(2)">Vis/skjul fasit</button>

    <div id="resultat2" class="resultat"></div>

    <div id="fasit2" class="fasit">
        <strong>Fasit:</strong>
        20
        <p>3 · 4 + 8 = 12 + 8 = 20</p>
    </div>
</section>

</main>

<script>
let riktige = new Set();

function normaliser(svar) {
    return svar
        .trim()
        .toLowerCase()
        .replace(/\s+/g, "")
        .replace(",", ".");
}

function sjekk(nummer, fasit) {
    const input = document.getElementById("svar" + nummer);
    const resultat = document.getElementById("resultat" + nummer);

    const elevSvar = normaliser(input.value);
    const riktigSvar = normaliser(fasit);

    if (elevSvar === "") {
        resultat.textContent = "Skriv inn et svar først.";
        resultat.className = "resultat feil";
        return;
    }

    if (elevSvar === riktigSvar) {
        resultat.textContent = "Riktig svar! Veldig bra! 🎉";
        resultat.className = "resultat riktig";
        riktige.add(nummer);
    } else {
        resultat.textContent = "Ikke helt riktig. Prøv igjen!";
        resultat.className = "resultat feil";
    }

    document.getElementById("riktige").textContent = riktige.size;
}

function visFasit(nummer) {
    const fasit = document.getElementById("fasit" + nummer);

    if (fasit.style.display === "block") {
        fasit.style.display = "none";
    } else {
        fasit.style.display = "block";
    }
}
</script>

</body>
</html>
