<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ikke-lineare-likningssystemer – Matematikk 1T</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f3f6fb;
    color: #1d3557;
    margin: 0;
    padding: 25px 15px;
    line-height: 1.7;
}

main {
    max-width: 900px;
    margin: auto;
}

.tilbake {
    display: inline-block;
    color: #2864a0;
    text-decoration: none;
    margin-bottom: 20px;
}

header {
    background: #1d3557;
    color: white;
    padding: 28px;
    border-radius: 14px;
    margin-bottom: 25px;
}

header h1 { margin-top: 0; }

.oppgave {
    background: white;
    padding: 22px;
    margin-bottom: 18px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #0000000b;
}

.oppgave h2 {
    color: #2864a0;
    font-size: 19px;
    margin-top: 0;
}

.regnestykke {
    font-size: 19px;
    font-weight: bold;
    margin: 15px 0;
    overflow-wrap: anywhere;
}

details { margin-top: 18px; }

summary {
    display: inline-block;
    background: #2864a0;
    color: white;
    padding: 10px 19px;
    border-radius: 8px;
    cursor: pointer;
    list-style: none;
}

summary::-webkit-details-marker { display: none; }

summary:hover { background: #1d3557; }

details[open] summary { background: #64748b; }

.losning {
    background: #edf4fb;
    padding: 18px;
    margin-top: 15px;
    border-radius: 10px;
}

.losning p { margin: 8px 0; }

.svar {
    color: #16713b;
    font-weight: bold;
    border-top: 1px solid #cbd9e8;
    padding-top: 12px;
    margin-top: 15px !important;
}

footer {
    text-align: center;
    color: #718096;
    padding: 25px;
}
</style>
</head>

<body>
<main>

<a class="tilbake" href="index.html">
← Tilbake til Matematikk 1T
</a>

<header>
    <h1>ikke-lineare-likningssystemer</h1>
    <p>Matematikk 1T</p>
    <p>Oppgaver med trinnvise løsningsforslag.</p>
</header>

<div id="oppgaver"></div>

<footer>
Matematikk 1T – ikke-lineare-likningssystemer
<br>
Oppgaver med løsningsforslag
</footer>

</main>

<script>
const oppgaver = [

{
q: "x² + 6x",
s: `
<p>Vi setter x utenfor parentes:</p>
<p>x² + 6x = x(x + 6)</p>
<p class="svar">Svar: x(x + 6)</p>`
},

{
q: "x² − 8x",
s: `
<p>Vi setter x utenfor parentes:</p>
<p>x² − 8x = x(x − 8)</p>
<p class="svar">Svar: x(x − 8)</p>`
},

{
q: "2x² + 4x",
s: `
<p>Vi finner felles faktor 2x:</p>
<p>2x² + 4x = 2x(x + 2)</p>
<p class="svar">Svar: 2x(x + 2)</p>`
},

{
q: "x² + 6x + 9",
s: `
<p>Vi ser etter to tall med sum 6 og produkt 9.</p>
<p>Tallene er 3 og 3.</p>
<p>x² + 6x + 9 = (x + 3)(x + 3)</p>
<p class="svar">Svar: (x + 3)²</p>`
},

{
q: "x² − 4x + 4",
s: `
<p>Vi ser etter to tall med sum −4 og produkt 4.</p>
<p>x² − 4x + 4 = (x − 2)(x − 2)</p>
<p class="svar">Svar: (x − 2)²</p>`
},

{
q: "x² + 5x + 6",
s: `
<p>Vi leter etter to tall med sum 5 og produkt 6.</p>
<p>Tallene er 2 og 3.</p>
<p>x² + 5x + 6 = (x + 2)(x + 3)</p>
<p class="svar">Svar: (x + 2)(x + 3)</p>`
},

{
q: "x² − 8x + 16",
s: `
<p>Vi leter etter to tall med sum −8 og produkt 16.</p>
<p>x² − 8x + 16 = (x − 4)(x − 4)</p>
<p class="svar">Svar: (x − 4)²</p>`
},

{
q: "x² + 6x + 8",
s: `
<p>Vi leter etter to tall med sum 6 og produkt 8.</p>
<p>Tallene er 2 og 4.</p>
<p>x² + 6x + 8 = (x + 2)(x + 4)</p>
<p class="svar">Svar: (x + 2)(x + 4)</p>`
},

{
q: "x² + 9x + 18",
s: `
<p>Vi leter etter to tall med sum 9 og produkt 18.</p>
<p>Tallene er 3 og 6.</p>
<p>x² + 9x + 18 = (x + 3)(x + 6)</p>
<p class="svar">Svar: (x + 3)(x + 6)</p>`
},

{
q: "x² + x + 1",
s: `
<p>Diskriminanten er:</p>
<p>d = 1² − 4 · 1 · 1 = −3</p>
<p>Diskriminanten er negativ. Uttrykket kan derfor ikke faktoriseres i reelle lineære faktorer.</p>
<p class="svar">Svar: Kan ikke faktoriseres videre over de reelle tallene.</p>`
},

{
q: "x² − 7x + 10",
s: `
<p>Vi leter etter to tall med sum −7 og produkt 10.</p>
<p>Tallene er −5 og −2.</p>
<p>x² − 7x + 10 = (x − 5)(x − 2)</p>
<p class="svar">Svar: (x − 5)(x − 2)</p>`
},

{
q: "x² − 6x + 5",
s: `
<p>Vi leter etter to tall med sum −6 og produkt 5.</p>
<p>Tallene er −1 og −5.</p>
<p>x² − 6x + 5 = (x − 1)(x − 5)</p>
<p class="svar">Svar: (x − 1)(x − 5)</p>`
},

{
q: "x² − x − 2",
s: `
<p>Vi leter etter to tall med sum −1 og produkt −2.</p>
<p>Tallene er −2 og 1.</p>
<p>x² − x − 2 = (x − 2)(x + 1)</p>
<p class="svar">Svar: (x − 2)(x + 1)</p>`
},

{
q: "2x² − 4x − 6",
s: `
<p>Først setter vi 2 utenfor parentes:</p>
<p>2(x² − 2x − 3)</p>
<p>Vi faktoriserer parentesen:</p>
<p>2(x − 3)(x + 1)</p>
<p class="svar">Svar: 2(x − 3)(x + 1)</p>`
},

{
q: "2x² + x − 1",
s: `
<p>Vi faktoriserer ved å dele opp midtleddet:</p>
<p>2x² + 2x − x − 1</p>
<p>2x(x + 1) − 1(x + 1)</p>
<p>(2x − 1)(x + 1)</p>
<p class="svar">Svar: (2x − 1)(x + 1)</p>`
},

{
q: "2x² − 12x + 10",
s: `
<p>Vi setter 2 utenfor parentes:</p>
<p>2(x² − 6x + 5)</p>
<p>Vi faktoriserer parentesen:</p>
<p>2(x − 1)(x − 5)</p>
<p class="svar">Svar: 2(x − 1)(x − 5)</p>`
},

{
q: "3x² − 2x + 1/3",
s: `
<p>Vi setter 3 utenfor parentes:</p>
<p>3(x² − 2/3x + 1/9)</p>
<p>Dette er et fullstendig kvadrat:</p>
<p>3(x − 1/3)²</p>
<p class="svar">Svar: 3(x − 1/3)²</p>`
},

{
q: "x² − 16",
s: `
<p>Dette er en differanse mellom to kvadrater:</p>
<p>x² − 4²</p>
<p>Vi bruker regelen a² − b² = (a − b)(a + b).</p>
<p class="svar">Svar: (x − 4)(x + 4)</p>`
},

{
q: "16x² − 25",
s: `
<p>Vi skriver uttrykket som differanse mellom to kvadrater:</p>
<p>(4x)² − 5²</p>
<p class="svar">Svar: (4x − 5)(4x + 5)</p>`
},

{
q: "4x² − 9y²",
s: `
<p>Vi skriver uttrykket som differanse mellom to kvadrater:</p>
<p>(2x)² − (3y)²</p>
<p class="svar">Svar: (2x − 3y)(2x + 3y)</p>`
},

{
q: "9x² − 9",
s: `
<p>Vi setter 9 utenfor parentes:</p>
<p>9(x² − 1)</p>
<p>Vi bruker konjugatsetningen:</p>
<p class="svar">Svar: 9(x − 1)(x + 1)</p>`
},

{
q: "(x − 1)² − 16",
s: `
<p>Vi bruker differansen mellom to kvadrater:</p>
<p>(x − 1)² − 4²</p>
<p>= (x − 1 − 4)(x − 1 + 4)</p>
<p class="svar">Svar: (x − 5)(x + 3)</p>`
},

{
q: "(x − 2)² − (x − 3)²",
s: `
<p>Vi bruker differansen mellom to kvadrater:</p>
<p>[(x − 2) − (x − 3)] · [(x − 2) + (x − 3)]</p>
<p>= 1 · (2x − 5)</p>
<p class="svar">Svar: 2x − 5</p>`
},

{
q: "3x² + 18x + 24",
s: `
<p>Vi setter 3 utenfor parentes:</p>
<p>3(x² + 6x + 8)</p>
<p>Vi faktoriserer parentesen:</p>
<p class="svar">Svar: 3(x + 2)(x + 4)</p>`
},

{
q: "4x² + 12x + 9",
s: `
<p>Dette er et fullstendig kvadrat:</p>
<p>(2x)² + 2 · 2x · 3 + 3²</p>
<p class="svar">Svar: (2x + 3)²</p>`
},

{
q: "2x² + 3x − 2",
s: `
<p>Vi deler opp midtleddet:</p>
<p>2x² + 4x − x − 2</p>
<p>2x(x + 2) − 1(x + 2)</p>
<p class="svar">Svar: (2x − 1)(x + 2)</p>`
},

{
q: "−3x² + 2x + 1",
s: `
<p>Vi setter −1 utenfor parentes:</p>
<p>−(3x² − 2x − 1)</p>
<p>Vi faktoriserer uttrykket i parentes:</p>
<p>−(3x + 1)(x − 1)</p>
<p class="svar">Svar: (1 − x)(3x + 1)</p>`
},

{
q: "−4x² − x + 3",
s: `
<p>Vi setter −1 utenfor parentes:</p>
<p>−(4x² + x − 3)</p>
<p>Vi faktoriserer uttrykket i parentes:</p>
<p>−(4x − 3)(x + 1)</p>
<p class="svar">Svar: (3 − 4x)(x + 1)</p>`
},

{
q: "2x³ + 14x² + 24x",
s: `
<p>Vi setter 2x utenfor parentes:</p>
<p>2x(x² + 7x + 12)</p>
<p>Vi faktoriserer andregradsuttrykket:</p>
<p class="svar">Svar: 2x(x + 3)(x + 4)</p>`
},

{
q: "x²(x − 2) − 4(x − 2)",
s: `
<p>Vi ser at (x − 2) er en felles faktor:</p>
<p>(x − 2)(x² − 4)</p>
<p>Vi bruker differansen mellom to kvadrater:</p>
<p>(x − 2)(x − 2)(x + 2)</p>
<p class="svar">Svar: (x − 2)²(x + 2)</p>`
},

{
q: "x²(x − 3) − 4(x − 3)",
s: `
<p>Vi setter (x − 3) utenfor parentes:</p>
<p>(x − 3)(x² − 4)</p>
<p>Vi faktoriserer differansen mellom to kvadrater:</p>
<p class="svar">Svar: (x − 3)(x − 2)(x + 2)</p>`
},

{
q: "(x − 2)² − (x² − 4)",
s: `
<p>Vi ganger ut første parentes:</p>
<p>x² − 4x + 4 − x² + 4</p>
<p>Vi samler leddene:</p>
<p>−4x + 8</p>
<p>Vi setter −4 utenfor parentes:</p>
<p class="svar">Svar: −4(x − 2)</p>`
},

{
q: "(x − 2)² − (2x + 1)²",
s: `
<p>Vi bruker differansen mellom to kvadrater:</p>
<p>[(x − 2) − (2x + 1)] · [(x − 2) + (2x + 1)]</p>
<p>= (−x − 3)(3x − 1)</p>
<p class="svar">Svar: −(x + 3)(3x − 1)</p>`
},

{
q: "2(x + 2)² − 32",
s: `
<p>Vi setter 2 utenfor parentes:</p>
<p>2[(x + 2)² − 16]</p>
<p>Vi bruker differansen mellom to kvadrater:</p>
<p>2[(x + 2 − 4)(x + 2 + 4)]</p>
<p class="svar">Svar: 2(x − 2)(x + 6)</p>`
},

{
q: "2(x − 1) + (x + 3)(x − 1) + (x − 1)²",
s: `
<p>Vi ser at (x − 1) er en felles faktor:</p>
<p>(x − 1)[2 + (x + 3) + (x − 1)]</p>
<p>Vi samler leddene i parentesen:</p>
<p>(x − 1)(2 + x + 3 + x − 1)</p>
<p>= (x − 1)(2x + 4)</p>
<p class="svar">Svar: 2(x − 1)(x + 2)</p>`
},

{
q: "x(x + 2)² − 3(x + 1)(x + 2) − (x + 2)",
s: `
<p>Vi setter (x + 2) utenfor parentes:</p>
<p>(x + 2)[x(x + 2) − 3(x + 1) − 1]</p>
<p>Vi ganger ut parentesene:</p>
<p>(x + 2)[x² + 2x − 3x − 3 − 1]</p>
<p>Vi samler leddene:</p>
<p>(x + 2)(x² − x − 4)</p>
<p>Andregradsuttrykket har diskriminant 17 og kan ikke faktoriseres med rasjonale tall.</p>
<p class="svar">Svar: (x + 2)(x² − x − 4)</p>`
},

{
q: "3(x + 1)² − 2(x + 1)(2 − x) − x − 1",
s: `
<p>Vi ser at (x + 1) er en felles faktor:</p>
<p>(x + 1)[3(x + 1) − 2(2 − x) − 1]</p>
<p>Vi ganger ut parentesene:</p>
<p>(x + 1)(3x + 3 − 4 + 2x − 1)</p>
<p>Vi samler leddene:</p>
<p>(x + 1)(5x − 2)</p>
<p class="svar">Svar: (x + 1)(5x − 2)</p>`
}

];

const container = document.getElementById("oppgaver");

oppgaver.forEach((oppgave, index) => {
    const section = document.createElement("section");
    section.className = "oppgave";

    section.innerHTML = `
        <h2>Oppgave ${index + 1}</h2>
        <p>Faktoriser uttrykket mest mulig:</p>
        <div class="regnestykke">${oppgave.q}</div>
        <details>
            <summary>Vis løsning</summary>
            <div class="losning">${oppgave.s}</div>
        </details>
    `;

    container.appendChild(section);
});

</script>

</body>
</html>
